[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cineagent"
version = "4.0.0"
description = "Provider-neutral, shot-based, audio-timeline-driven AI video production system"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cineagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
