name: OrcaCode Review On Demand

on:
  issue_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  on-demand-review:
    runs-on: ubuntu-latest
    if: |
      github.event.issue.pull_request &&
      (startsWith(github.event.comment.body, '/orcacode-review') ||
        startsWith(github.event.comment.body, '/orcacode review') ||
        github.event.comment.body == '@orcacode-review' ||
        github.event.comment.body == '@orcacode review' ||
        startsWith(github.event.comment.body, '@orcacode-review ') ||
        startsWith(github.event.comment.body, '@orcacode review ')) &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    steps:
      - uses: Continuum-AI-Corp/orca-code-review@v1
        with:
          orcarouter-api-key: ${{ secrets.ORCAROUTER_API_KEY }}
