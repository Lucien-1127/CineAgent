name: OrcaCode Review

on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: Continuum-AI-Corp/orca-code-review@5ecfbf339ccbe5e6a6107259e0369d424846deb4
        with:
          orcarouter-api-key: ${{ secrets.ORCAROUTER_API_KEY }}
          auto-review-authors: "OWNER,MEMBER,COLLABORATOR,CONTRIBUTOR"
          engine-version: "1.3.13"
          precision-filter: "false"
          # A partial result fails closed. Keep per-file request pressure below
          # the router/model quota so every selected file can finish.
          concurrency: "8"
          timeout-minutes: "45"
