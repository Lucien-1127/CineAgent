name: OrcaCode Review

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        (startsWith(github.event.comment.body, '/orcacode-review') ||
          startsWith(github.event.comment.body, '/orcacode review') ||
          github.event.comment.body == '@orcacode-review' ||
          github.event.comment.body == '@orcacode review' ||
          startsWith(github.event.comment.body, '@orcacode-review ') ||
          startsWith(github.event.comment.body, '@orcacode review ')) &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    steps:
      - uses: Continuum-AI-Corp/orca-code-review@5ecfbf339ccbe5e6a6107259e0369d424846deb4
        with:
          orcarouter-api-key: ${{ secrets.ORCAROUTER_API_KEY }}
          auto-review-authors: "OWNER,MEMBER,COLLABORATOR,CONTRIBUTOR"
