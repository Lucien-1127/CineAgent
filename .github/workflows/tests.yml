name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: compile
        run: python -m compileall -q cineagent run_pipeline.py tests
      - name: offline tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v
